<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Maker Unified Shell Preview</title>
<style>
:root {
  --bg: #201A40;
  --bg2: #2A2350;
  --panel: #332B66;
  --panel2: #3D3475;
  --ink: #F3F0FF;
  --muted: #A79FD6;
  --line: #4A4090;
  --gold: #FFC93C;
  --lili: #FF6FB5;
  --green: #2F9E68;
  --paper: #FFF5DC;
  --paper2: #F1E3BF;
  --plum: #2F2845;
  --shadow: #171229;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: Nunito, system-ui, -apple-system, Segoe UI, sans-serif;
  background: radial-gradient(1200px 600px at 50% -10%, #2E2660 0%, var(--bg) 60%);
  color: var(--ink);
  overflow: hidden;
}
button { font: inherit; }
.app {
  height: 100vh;
  height: 100dvh;
  padding: 10px 12px;
}
.game {
  height: calc(100vh - 20px);
  height: calc(100dvh - 20px);
  display: grid;
  grid-template-columns: clamp(142px, 16vw, 210px) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  gap: 10px 12px;
}
.rail {
  grid-column: 1;
  grid-row: 1 / -1;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding: 10px;
  border: 2px solid var(--line);
  border-radius: 18px;
  background: rgba(51, 43, 102, .72);
  overflow: hidden;
}
.back {
  min-height: 44px;
  border: 0;
  border-radius: 12px;
  background: var(--panel);
  color: var(--ink);
  font-weight: 900;
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.chips {
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  padding: 2px 4px 2px 0;
}
.chip {
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 8px 10px;
  color: var(--muted);
  background: transparent;
  font-size: 13px;
  font-weight: 900;
  text-align: left;
}
.chip span:first-child { width: 22px; text-align: center; }
.chip.on {
  color: #1c1436;
  background: var(--lili);
  border-color: transparent;
}
.sound {
  min-height: 34px;
  border: 0;
  border-radius: 12px;
  background: var(--panel);
  color: var(--ink);
}
.hud {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  justify-content: center;
  gap: 10px;
}
.stat {
  min-width: 92px;
  padding: 10px 16px;
  border: 2px solid transparent;
  border-radius: 16px;
  background: var(--panel);
  text-align: center;
}
.stat:first-child, .stat:nth-child(2) { border-color: var(--lili); }
.stat .k {
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.stat .v {
  margin-top: 1px;
  font-family: Fredoka, Arial Rounded MT Bold, system-ui, sans-serif;
  font-size: 26px;
  font-weight: 900;
  line-height: 1;
}
.stage {
  grid-column: 2;
  grid-row: 2;
  min-height: 0;
  position: relative;
  overflow: hidden;
  border: 2px solid var(--line);
  border-radius: 18px;
  background: linear-gradient(180deg, var(--bg2), var(--panel));
}
.game-scene {
  position: relative;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  padding: clamp(12px, 1.6vw, 20px);
  overflow: hidden;
}
.change-playfield {
  height: 100%;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: clamp(10px, 1.4vw, 16px);
  border: 2px solid var(--line);
  border-radius: 16px;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
    rgba(39, 33, 79, .86);
  background-size: 32px 32px;
  padding: clamp(12px, 1.6vw, 18px);
}
.summary {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, .9fr);
  gap: 12px;
}
.card {
  min-width: 0;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: var(--paper);
  color: var(--plum);
  padding: 12px;
  box-shadow: 0 4px 0 rgba(0,0,0,.22);
}
.product {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
}
.product-art {
  height: 64px;
  display: grid;
  place-items: center;
  border: 2px solid var(--plum);
  border-radius: 12px;
  background: var(--paper2);
  font-size: 34px;
}
.label {
  color: #655D76;
  font-size: 12px;
  font-weight: 900;
}
.price, .paid, .display {
  font-family: Fredoka, Arial Rounded MT Bold, system-ui, sans-serif;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.price { font-size: clamp(28px, 3vw, 40px); }
.display-card {
  display: grid;
  place-items: center;
  background: var(--green);
  color: var(--ink);
}
.display {
  width: 100%;
  min-height: 58px;
  display: grid;
  place-items: center;
  border: 2px solid var(--plum);
  border-radius: 12px;
  background: rgba(23, 18, 41, .78);
  color: var(--ink);
  font-size: clamp(22px, 2.7vw, 32px);
}
.paid-card { text-align: center; }
.paid {
  margin-top: 8px;
  min-height: 58px;
  display: grid;
  place-items: center;
  border: 2px solid var(--plum);
  border-radius: 12px;
  background: var(--paper2);
  font-size: clamp(24px, 2.5vw, 32px);
}
.work {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(250px, .9fr) minmax(0, 1.25fr);
  gap: clamp(12px, 1.8vw, 22px);
  align-items: stretch;
}
.till-zone, .tray-zone {
  min-height: 0;
  display: grid;
  align-content: center;
}
.till {
  width: min(100%, 360px);
  justify-self: center;
  border: 2px solid var(--line);
  border-radius: 18px;
  background: linear-gradient(180deg, #40b979, var(--green));
  padding: 16px;
  box-shadow: 0 8px 0 rgba(0,0,0,.22);
}
.till-screen {
  width: 58%;
  margin: 0 auto 14px;
  border: 2px solid var(--plum);
  border-radius: 10px;
  background: var(--paper);
  color: var(--plum);
  padding: 9px;
  text-align: center;
  font-family: Fredoka, system-ui, sans-serif;
  font-weight: 900;
}
.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  max-width: 220px;
  margin: 0 auto 16px;
}
.key {
  aspect-ratio: 1;
  border: 2px solid var(--plum);
  border-radius: 10px;
  background: var(--paper2);
}
.drawer {
  display: grid;
  grid-template-columns: repeat(4, minmax(54px, 1fr));
  gap: 10px;
  border: 2px solid var(--plum);
  border-radius: 14px;
  background: #d8b176;
  padding: 12px;
}
.money {
  min-height: 56px;
  border: 2px solid var(--plum);
  border-radius: 50%;
  background: #ead296;
  color: var(--plum);
  font-family: Fredoka, system-ui, sans-serif;
  font-weight: 900;
  box-shadow: 0 3px 0 rgba(0,0,0,.22);
}
.money.note {
  grid-column: span 2;
  border-radius: 12px;
  background: #a3d1b2;
}
.tray-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.tray-total {
  color: var(--ink);
  font-family: Fredoka, system-ui, sans-serif;
  font-size: clamp(30px, 3.4vw, 42px);
  font-weight: 900;
}
.tray {
  min-height: 160px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 2px solid var(--line);
  border-radius: 16px;
  background: rgba(241, 227, 191, .12);
  padding: 16px;
}
.tray-token {
  min-width: 72px;
  min-height: 62px;
  display: grid;
  place-items: center;
  border: 2px solid var(--paper);
  border-radius: 14px;
  background: var(--paper2);
  color: var(--plum);
  font-family: Fredoka, system-ui, sans-serif;
  font-weight: 900;
}
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}
.action {
  min-height: 52px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: var(--paper);
  color: var(--plum);
  font-weight: 900;
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.action.primary {
  grid-column: 1 / -1;
  background: var(--green);
  color: var(--ink);
}
.hint {
  min-height: 28px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 900;
  text-align: center;
}
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  .game {
    height: auto;
    min-height: calc(100vh - 20px);
    grid-template-columns: 1fr;
    grid-template-rows: auto auto minmax(520px, 1fr);
  }
  .rail {
    grid-column: 1;
    grid-row: 1;
    grid-template-columns: auto 1fr auto;
    grid-template-rows: auto;
  }
  .chips { flex-direction: row; overflow-x: auto; }
  .chip { min-width: max-content; }
  .hud { grid-column: 1; grid-row: 2; }
  .stage { grid-column: 1; grid-row: 3; min-height: 620px; }
  .summary, .work { grid-template-columns: 1fr; }
  .drawer { grid-template-columns: repeat(2, minmax(54px, 1fr)); }
}
</style>
</head>
<body>
<main class="app">
  <section class="game" aria-label="Summer Quest game shell">
    <aside class="rail" aria-label="Game navigation">
      <button class="back" type="button">&larr; Lili</button>
      <nav class="chips" aria-label="Games">
        <button class="chip" type="button"><span>🚜</span><span>Big Machines</span></button>
        <button class="chip" type="button"><span>🏙️</span><span>City Drive</span></button>
        <button class="chip" type="button"><span>⛏️</span><span>Dig Site</span></button>
        <button class="chip" type="button"><span>🎈</span><span>Balloon Pop</span></button>
        <button class="chip" type="button"><span>🎯</span><span>Home Row</span></button>
        <button class="chip" type="button"><span>🪐</span><span>Solar System</span></button>
        <button class="chip on" type="button"><span>💱</span><span>Change Maker</span></button>
        <button class="chip" type="button"><span>🧠</span><span>Word Memory</span></button>
      </nav>
      <button class="sound" type="button" aria-label="Sound on">🔊</button>
    </aside>

    <header class="hud" aria-label="Round status">
      <div class="stat"><div class="k">Time</div><div class="v">1:12</div></div>
      <div class="stat"><div class="k">Tasks</div><div class="v">3/10</div></div>
      <div class="stat"><div class="k">Best</div><div class="v">8</div></div>
    </header>

    <section class="stage" aria-label="Game stage">
      <div class="game-scene game-scene--brain game-scene--change">
        <div class="change-playfield">
          <div class="summary">
            <section class="card product" aria-label="Product and price">
              <div class="product-art" aria-hidden="true">🥛</div>
              <div>
                <div class="label">Milk 牛奶</div>
                <div class="price">NT$39</div>
              </div>
            </section>
            <section class="card display-card" aria-label="Register">
              <div class="display">NT$100 - NT$39</div>
              <div class="label" style="color:var(--ink);margin-top:6px">Register 收銀機</div>
            </section>
            <section class="card paid-card" aria-label="Paid amount">
              <div class="label">Paid 已付</div>
              <div class="paid">NT$100</div>
            </section>
          </div>

          <div class="work">
            <section class="till-zone" aria-label="Cash drawer">
              <div class="till">
                <div class="till-screen">NT$100</div>
                <div class="keys" aria-hidden="true">
                  <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                  <div class="key"></div><div class="key"></div><div class="key"></div><div class="key"></div>
                </div>
                <div class="drawer">
                  <button class="money note" type="button">NT$50</button>
                  <button class="money" type="button">NT$10</button>
                  <button class="money" type="button">NT$5</button>
                  <button class="money" type="button">NT$1</button>
                </div>
              </div>
            </section>

            <section class="tray-zone" aria-label="Change tray">
              <div class="tray-head">
                <div>
                  <div class="label" style="color:var(--muted)">Your change 你找的錢</div>
                </div>
                <div class="tray-total">NT$60</div>
              </div>
              <div class="tray">
                <div class="tray-token">NT$50</div>
                <div class="tray-token">NT$10</div>
              </div>
              <div class="actions">
                <button class="action" type="button">Undo 上一步</button>
                <button class="action" type="button">Clear tray 清空托盤</button>
                <button class="action primary" type="button">Give change 找錢</button>
              </div>
            </section>
          </div>

          <div class="hint">Tap coins or notes, then give the change. 點硬幣或鈔票，然後找錢。</div>
        </div>
      </div>
    </section>
  </section>
</main>
</body>
</html>
