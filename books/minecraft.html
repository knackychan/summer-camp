<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Minecraft Evolution · Minecraft 的演化史</title>
<style>
:root{
  --bg:#0E120D;--paper:#10160F;--panel:#20271E;--panel2:#252D22;
  --ink:#F7F3D8;--muted:#C8D1BB;--line:rgba(244,242,223,.18);
  --grass:#79C64A;--gold:#F2C94C;--sky:#65A9DC;--copper:#D8894D;--nether:#DD5C4D;--cherry:#F3A8BD;
  --shadow:0 14px 42px rgba(0,0,0,.44);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:Nunito,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);background:
    radial-gradient(circle at 16% 0%,rgba(121,198,74,.2),transparent 24rem),
    radial-gradient(circle at 88% 8%,rgba(101,169,220,.18),transparent 24rem),
    linear-gradient(135deg,#10160F,#202216 52%,#141412);
  display:flex;flex-direction:column;align-items:center;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
h1,h2{font-family:Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif}
.hidden{display:none!important}
.topbar{width:100%;max-width:1180px;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-shrink:0;z-index:10}
.btn{
  font-family:Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:.88rem;font-weight:800;
  padding:10px 16px;border:0;border-radius:28px;background:#20271E;color:var(--ink);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;
}
.btn:active{background:#2C3628;transform:scale(.96)}
.btn.arrow{width:48px;height:48px;border-radius:50%;font-size:1.15rem;padding:0}
.btn:disabled{opacity:.35}
.spacer{flex:1}
.badge{font-family:Fredoka,system-ui;font-weight:900;color:#10140E;background:var(--gold);padding:7px 11px;border-radius:20px}
.masthead{width:100%;max-width:1180px;padding:0 16px 10px;display:flex;align-items:end;gap:16px}
.masthead h1{font-size:clamp(1.55rem,4vw,4.1rem);line-height:.92;letter-spacing:-.025em}
.masthead .zh{display:block;margin-top:5px;color:#E8EFD6;font-size:clamp(1rem,2vw,1.7rem);line-height:1.2;letter-spacing:0;font-weight:900}
.stage{flex:1;width:100%;max-width:1180px;display:flex;align-items:flex-start;justify-content:center;padding:8px 12px 0;overflow:hidden;min-height:0}
.spread{
  --mcraft-accent:var(--grass);
  width:100%;height:100%;max-height:680px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;
  padding:8px;border-radius:12px;overflow:hidden;position:relative;isolation:isolate;
  background:linear-gradient(90deg,rgba(255,255,255,.06),transparent 18%,transparent 82%,rgba(255,255,255,.05)),var(--paper);
  box-shadow:var(--shadow);transition:opacity .18s,transform .18s;
}
.spread::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.08);pointer-events:none;z-index:5}
.spread.turning{opacity:.4;transform:scale(.97)}
@media(prefers-reduced-motion:reduce){.spread{transition:none}}
.page{
  min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;
  padding:18px;border:1px solid var(--line);border-radius:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),transparent 44%),var(--panel);
  overflow:hidden;
}
.page::after{content:attr(data-page);position:absolute;right:12px;bottom:10px;z-index:7;color:rgba(244,242,223,.62);font:.76rem/1 Fredoka,system-ui;font-weight:800}
.page.photo{padding:0;cursor:pointer;background:#0D100C}
.page.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02)}
.page.photo::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.24) 36%,rgba(0,0,0,.84)),linear-gradient(90deg,rgba(0,0,0,.4),transparent 58%)}
.copy{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px}
.page.photo .copy{position:absolute;left:16px;right:16px;bottom:16px}
.page.text{justify-content:flex-end;gap:12px}
.page.quote{justify-content:center;background:linear-gradient(145deg,rgba(121,198,74,.18),rgba(216,137,77,.13)),var(--panel2)}
.kicker{display:inline-flex;width:fit-content;padding:6px 8px;background:var(--mcraft-accent);color:#10140E;font:.72rem/1 Fredoka,system-ui;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.gold{--mcraft-accent:var(--gold)}.sky{--mcraft-accent:var(--sky)}.grass{--mcraft-accent:var(--grass)}.copper{--mcraft-accent:var(--copper)}.nether{--mcraft-accent:var(--nether)}.cherry{--mcraft-accent:var(--cherry)}
.title{margin:0;max-width:13ch;color:var(--ink);font:900 clamp(1.35rem,3vw,3.15rem)/.92 Fredoka,system-ui;letter-spacing:-.025em;overflow-wrap:anywhere}
.title-zh{color:#E8EFD6;font-size:clamp(1rem,1.7vw,1.45rem);line-height:1.28;font-weight:900;word-break:break-word}
.body{margin:0;color:var(--muted);font-size:.92rem;line-height:1.48;font-weight:800;overflow-wrap:anywhere}
.body.zh{color:#E8EFD6;font-size:1.08rem;line-height:1.55;font-weight:800;word-break:break-word}
.pull{margin:0;color:var(--ink);font:900 clamp(1.25rem,2.35vw,2.5rem)/1 Fredoka,system-ui;letter-spacing:-.025em;overflow-wrap:anywhere}
.hint{color:#DDE8C9;font-size:.86rem;line-height:1.25;font-weight:900;opacity:.82}
.meta{position:absolute;left:16px;top:14px;z-index:4;display:inline-flex;padding:7px 9px;background:var(--gold);color:#10140E;font:.72rem/1 Fredoka,system-ui;font-weight:900}
.nav{width:100%;max-width:1180px;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 16px 12px;flex-shrink:0}
.pager{font-family:Fredoka,system-ui;font-size:.88rem;font-weight:900;color:var(--muted);min-width:82px;text-align:center}
.dots{display:flex;gap:3px;align-items:center;justify-content:center;max-width:48vw;overflow:hidden}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(244,242,223,.24);flex:0 0 auto}
.dot.on{width:8px;height:8px;background:var(--gold)}
.gridview{width:100%;max-width:1180px;flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start}
.gridcard{width:calc(20% - 8px);min-width:120px;max-width:170px;aspect-ratio:1;border-radius:12px;background:var(--panel);border:2px solid rgba(244,242,223,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:4px;overflow:hidden;touch-action:manipulation}
.gridcard.current{border-color:var(--gold);box-shadow:0 0 12px rgba(242,201,76,.35)}
.gridcard img{width:100%;height:54%;object-fit:cover}
.gridcard .gname{font-family:Fredoka,system-ui;font-size:.72rem;line-height:1.12;font-weight:900;text-align:center;padding:0 6px;color:var(--ink)}
.gridcard .gname span{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center}
.zoom img{max-width:96vw;max-height:74vh;border-radius:12px;object-fit:contain}
.zoom .close{position:absolute;right:16px;top:16px;width:48px;height:48px;border:0;border-radius:50%;background:var(--panel);color:var(--ink);font-size:1.5rem;cursor:pointer}
.zoom .cap{margin-top:14px;color:var(--muted);font-size:1.05rem;font-weight:900;text-align:center;padding:0 18px}
/* ── Magazine floating overlays ── */
.ovl{position:absolute;z-index:6;pointer-events:none;opacity:0;animation:ovlIn .6s ease-out forwards, ovlFloat 18s ease-in-out .6s infinite}
.ovl img{display:block;width:var(--ovl-s,48px);height:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.ovl svg{display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55))}
@keyframes ovlIn{from{opacity:0;transform:translateY(12px) rotate(var(--ovl-rot,0deg)) scale(.85)}to{opacity:var(--ovl-op,.15);transform:translateY(0) rotate(var(--ovl-rot,0deg)) scale(1)}}
@keyframes ovlFloat{0%,100%{transform:translateY(0) rotate(var(--ovl-rot,0deg))}50%{transform:translateY(-7px) rotate(calc(var(--ovl-rot,0deg) + 2deg))}}
.ovl-deco{position:absolute;z-index:5;pointer-events:none;opacity:.1;animation:ovlFloat 26s ease-in-out infinite}
.spread.gold .ovl{--ovl-op:.32} .spread.sky .ovl{--ovl-op:.3} .spread.grass .ovl{--ovl-op:.32}
.spread.copper .ovl{--ovl-op:.28} .spread.nether .ovl{--ovl-op:.26} .spread.cherry .ovl{--ovl-op:.34}
/* ── Magazine furniture: era tag, stat badge, gallery, tip/fact cards, key chips.
      Markup comes from js/books/minecraft-magazine.js and is shared with the
      in-app reader in index.html, which carries its own copy of these rules. ── */
.mcx-era{position:absolute;left:16px;top:44px;z-index:4;display:inline-flex;padding:5px 8px;
  background:rgba(16,20,14,.74);border-left:3px solid var(--mcraft-accent);
  color:#E8EFD6;font:.68rem/1.15 Fredoka,system-ui;font-weight:900;letter-spacing:.03em}
.mcx-stat{position:absolute;right:14px;top:14px;z-index:4;max-width:46%;text-align:right;
  padding:8px 10px;border-radius:4px;background:rgba(16,20,14,.78);border-right:3px solid var(--mcraft-accent)}
.mcx-stat b{display:block;color:var(--mcraft-accent);font:900 clamp(1.25rem,2.6vw,2rem)/1 Fredoka,system-ui;letter-spacing:-.02em}
.mcx-stat-label{display:block;margin-top:3px;color:#DDE8C9;font-size:.66rem;line-height:1.2;font-weight:900}
.mcx-band{position:absolute;left:0;right:0;top:0;height:54%;z-index:0;padding:0;border:0;
  overflow:hidden;background:#0D100C;cursor:pointer;display:block;touch-action:manipulation}
.mcx-band img{width:100%;height:100%;object-fit:cover;display:block}
.mcx-band::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(13,16,12,.62),rgba(13,16,12,.12) 38%,rgba(32,39,30,.86) 78%,#20271E)}
.page.quote .mcx-band{height:50%}
.page.quote .copy,.page.quote .mcraft-copy{margin-top:auto}
.page.quote .mcx-band::after{background:linear-gradient(180deg,rgba(13,16,12,.62),rgba(13,16,12,.12) 34%,rgba(42,49,38,.86) 76%,#2A3126)}
.mcx-thumb:active img{transform:scale(1.03)}
.mcx-card{position:relative;z-index:3;padding:10px 12px;border-radius:6px;
  background:rgba(16,20,14,.7);border-left:4px solid var(--mcraft-accent);box-shadow:0 6px 18px rgba(0,0,0,.34)}
.mcx-card-label{display:block;margin-bottom:4px;color:var(--mcraft-accent);
  font:.66rem/1 Fredoka,system-ui;font-weight:900;letter-spacing:.09em;text-transform:uppercase}
.mcx-card-text{display:block;color:#DDE8C9;font-size:.82rem;line-height:1.42;font-weight:800}
.mcx-card-text.mcx-zh{font-size:.95rem;line-height:1.5}
.mcx-keys{list-style:none;display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.mcx-keys li{padding:5px 8px;border:1px solid var(--mcraft-accent);border-radius:20px;
  color:#E8EFD6;font:.68rem/1 Fredoka,system-ui;font-weight:900}
.mcx-rhead{position:absolute;left:18px;right:18px;top:14px;z-index:3;text-shadow:0 1px 4px rgba(0,0,0,.75);display:flex;align-items:baseline;gap:8px;
  padding-bottom:8px;border-bottom:1px solid rgba(244,242,223,.16);color:rgba(244,242,223,.58);
  font:.7rem/1.2 Fredoka,system-ui;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
.mcx-rhead b{flex:0 0 auto;color:var(--mcraft-accent);font-size:.95rem}
.mcx-rhead span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:860px){
  .spread{overflow-y:auto;align-content:start}
  .page{min-height:250px}
  .gridcard{width:calc(33.333% - 8px)}
}
html[data-lang="zh"] .title,html[data-lang="zh"] .pull,html[data-lang="zh"] .body:not(.zh),html[data-lang="zh"] .masthead .en{display:none}
html[data-lang="en"] .title-zh,html[data-lang="en"] .body.zh,html[data-lang="en"] .masthead .zh{display:none}
html[data-lang="zh"] .mcx-en{display:none}
html[data-lang="en"] .mcx-zh{display:none}
@media(prefers-reduced-motion:reduce){.ovl,.ovl-deco{animation:none;opacity:.28}}
@media(max-width:520px){
  /* Phones stack to one column and the page shrinks — drop the side furniture
     so the copy still fits without scrolling. */
  .ovl,.ovl-deco{display:none}
  .mcx-stat{padding:6px 8px}.mcx-stat b{font-size:1.1rem}
  html,body{width:100vw;max-width:100vw;overflow-x:hidden}
  .topbar{padding:8px 10px;gap:7px;flex-wrap:wrap;justify-content:flex-start}.spacer{display:none}
  .btn{font-size:.78rem;padding:8px 10px}.badge{font-size:.78rem;padding:7px 9px}
  .topbar,.masthead,.stage,.nav{width:100vw;max-width:100vw}
  .masthead{padding:0 10px 8px}.stage{padding:0 8px}
  .nav{gap:6px;padding:8px 8px 10px}.dots{max-width:30vw}
  .spread{grid-template-columns:1fr;width:calc(100vw - 16px);max-width:calc(100vw - 16px);overflow-x:hidden}
  .page,.copy{max-width:100%}
  .page{min-height:260px;padding-right:42px}
  .page.photo{min-height:430px}
  .page.photo .copy{right:42px}
  .title{font-size:1.65rem}
  .gridcard{width:calc(50% - 8px);min-width:0}
}
</style>
</head>
<body>
<div class="topbar">
  <button class="btn" onclick="location.href='../index.html#books'">← Shelf 書架</button>
  <span class="spacer"></span>
  <span class="badge" id="count"></span>
  <button class="btn" id="langBtn" onclick="toggleLang()">中文</button>
  <button class="btn" id="toggle" onclick="toggleView()">All Spreads 全部跨頁</button>
</div>
<header class="masthead">
  <h1><span class="en">The Evolution of Minecraft</span><span class="zh">Minecraft 的演化史</span></h1>
</header>
<section class="stage" id="stage"><div class="spread" id="spread"></div></section>
<div class="nav" id="nav">
  <button class="btn arrow" id="prev" onclick="turn(-1)" aria-label="Previous spread 上一跨頁">◀</button>
  <span class="pager" id="pager"></span>
  <div class="dots" id="dots"></div>
  <button class="btn arrow" id="next" onclick="turn(1)" aria-label="Next spread 下一跨頁">▶</button>
</div>
<div class="gridview hidden" id="grid"></div>

<script src="../js/books/minecraft-data.js"></script>
<script src="../js/books/minecraft-magazine.js"></script>
<script>
var idx=0,isGrid=false,spreads=[];
var FALLBACK_IMAGES=[
  "../assets/books/minecraft/minecraft-java-bedrock.jpg",
  "../assets/books/minecraft/2009-origin.jpg",
  "../assets/books/minecraft/2010-nether.jpg",
  "../assets/books/minecraft/2018-aquatic.jpg",
  "../assets/books/minecraft/2019-village-pillage.jpg",
  "../assets/books/minecraft/2021-caves-cliffs.jpg",
  "../assets/books/minecraft/2024-tricky-trials.jpg",
  "../assets/books/minecraft/2026-chaos-cubed.jpg"
];
/* Magazine mini-pages, 2 per turn instead of 4 — no scrolling, and every one of the
   25 topics' 4 authored blocks still gets its own page. Each topic spans exactly 2
   turns (pages [0,1] then [2,3]), so idx is a page-pair index (0..spreads.length*2-1). */
function init(){
  if(typeof MINECRAFT_SPREADS==="undefined"){
    document.getElementById("spread").innerHTML='<p style="color:#FF6B6B;padding:24px">Could not load Minecraft data. 無法載入 Minecraft 資料。</p>';
    return;
  }
  spreads=MINECRAFT_SPREADS.slice();
  var total=spreads.length*2;
  document.getElementById("count").textContent=total+" spreads · "+total+" 跨頁";
  setLang(localStorage.getItem("mcraftLang")||"en");
  renderSpread();renderGrid();updatePager();addSwipe();document.addEventListener("keydown",onKey);
}
function setLang(lang){
  document.documentElement.setAttribute("data-lang",lang);
  document.getElementById("langBtn").textContent=lang==="zh"?"English":"中文";
  localStorage.setItem("mcraftLang",lang);
}
function toggleLang(){setLang(document.documentElement.getAttribute("data-lang")==="zh"?"en":"zh");}
function pairTotal(){return spreads.length*2;}
function escapeHTML(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function spreadImage(s,i){return s.image||FALLBACK_IMAGES[i%FALLBACK_IMAGES.length];}
function spreadYear(s){
  var text=[s.titleEN,s.titleZH].concat((s.blocks||[]).map(function(b){return b.en+" "+b.zh;})).join(" ");
  var m=text.match(/\b(20\d{2}|19\d{2})\b/);
  return m?m[1]:"Evolution";
}
function tone(i){return ["gold","sky","grass","copper","nether","cherry"][i%6];}
function kicker(year,page){return (year==="Evolution"?"Minecraft":year)+" / page "+page;}
/* `extra` is the magazine furniture for this mini-page: a tip card, a fact card,
   or the key-feature chips. Empty string when the topic did not author one. */
function textPage(block,page,kind,toneName,kick,extra,head){
  var en=block&&block.en?block.en:"",zh=block&&block.zh?block.zh:"";
  if(kind==="quote"){
    return '<article class="page quote '+toneName+'" data-page="'+page+'">'+(head||"")+'<div class="copy">'+
      '<span class="kicker">'+escapeHTML(kick)+'</span>'+
      '<p class="pull">'+escapeHTML(en)+'</p><p class="body zh">'+escapeHTML(zh)+'</p>'+
      (extra||"")+'</div></article>';
  }
  return '<article class="page text '+toneName+'" data-page="'+page+'">'+(head||"")+'<div class="copy">'+
    '<span class="kicker">'+escapeHTML(kick)+'</span>'+
    '<p class="body">'+escapeHTML(en)+'</p><p class="body zh">'+escapeHTML(zh)+'</p>'+
    '</div>'+(extra||"")+'</article>';
}
function renderSpread(){
  var spreadIndex=Math.floor(idx/2),within=idx%2;
  var s=spreads[spreadIndex],el=document.getElementById("spread");
  if(!s){el.innerHTML="";return;}
  var img=spreadImage(s,spreadIndex),year=spreadYear(s),toneName=tone(spreadIndex),blocks=(s.blocks||[]).slice(0,4);
  while(blocks.length<4)blocks.push({en:"",zh:""});
  el.className="spread "+toneName;
  var pageBase=spreadIndex*4,mag=window.SQMcraftMag;
  if(within===0){
    el.innerHTML=
      '<article class="page photo" data-page="'+(pageBase+1)+'" data-photo="'+escapeHTML(img)+'" data-caption="'+escapeHTML(s.titleEN+" · "+s.titleZH)+'">'+
        '<img src="'+escapeHTML(img)+'" alt="'+escapeHTML(s.titleEN)+'" loading="lazy" onerror="this.style.display=\'none\'">'+
        '<span class="meta">SPREAD '+String(spreadIndex+1).padStart(2,"0")+' · '+escapeHTML(year)+'</span>'+
        (mag?mag.eraTag(s)+mag.statBadge(s):"")+
        '<div class="copy"><span class="kicker">'+escapeHTML(kicker(year,pageBase+1))+'</span>'+
        '<h2 class="title">'+escapeHTML(s.titleEN)+'</h2><div class="title-zh">'+escapeHTML(s.titleZH)+'</div>'+
        '<p class="body">'+escapeHTML(blocks[0].en)+'</p><p class="body zh">'+escapeHTML(blocks[0].zh)+'</p>'+
        '<div class="hint">Tap image to zoom · 點擊放大</div></div></article>'+
      textPage(blocks[1],pageBase+2,"text",toneName,kicker(year,pageBase+2),mag?mag.tipCard(s):"",mag?mag.runningHead(s,spreadIndex)+mag.imageBand(s,2):"");
    el.querySelector(".page.photo").onclick=function(){zoom(img,s.titleEN+" · "+s.titleZH);};
  }else{
    el.innerHTML=
      textPage(blocks[2],pageBase+3,"text",toneName,kicker(year,pageBase+3),mag?mag.factCard(s):"",mag?mag.runningHead(s,spreadIndex)+mag.imageBand(s,3):"")+
      textPage(blocks[3],pageBase+4,"quote",toneName,kicker(year,pageBase+4),mag?mag.keyChips(s):"",mag?mag.runningHead(s,spreadIndex)+mag.imageBand(s,4):"");
  }
  if(mag){mag.wireThumbs(el,zoom);mag.decorate(el,s,spreadIndex,within);}
  }
function turn(dir){
  var next=idx+dir;if(next<0||next>=pairTotal())return;
  var el=document.getElementById("spread");el.classList.add("turning");
  setTimeout(function(){idx=next;renderSpread();renderGrid();updatePager();el.classList.remove("turning");},180);
}
function updatePager(){
  var total=pairTotal();
  document.getElementById("pager").textContent=(idx+1)+" / "+total;
  document.getElementById("prev").disabled=idx===0;document.getElementById("next").disabled=idx===total-1;
  var html="";for(var i=0;i<total;i++)html+='<span class="dot'+(i===idx?' on':'')+'"></span>';
  document.getElementById("dots").innerHTML=html;
}
function toggleView(){
  isGrid=!isGrid;
  document.getElementById("toggle").textContent=isGrid?"Book 書本":"All Spreads 全部跨頁";
  document.getElementById("stage").classList.toggle("hidden",isGrid);
  document.getElementById("nav").classList.toggle("hidden",isGrid);
  document.getElementById("grid").classList.toggle("hidden",!isGrid);
  if(isGrid)renderGrid();
}
function renderGrid(){
  var html="",current=Math.floor(idx/2);
  spreads.forEach(function(s,i){
    html+='<button class="gridcard'+(i===current?' current':'')+'" data-page="'+(i*2)+'">'+
      '<img src="'+escapeHTML(spreadImage(s,i))+'" alt="'+escapeHTML(s.titleEN)+'" loading="lazy" onerror="this.style.display=\'none\'">'+
      '<span class="gname">'+escapeHTML(s.titleEN)+'<span>'+escapeHTML(s.titleZH)+'</span></span></button>';
  });
  var grid=document.getElementById("grid");grid.innerHTML=html;
  grid.querySelectorAll(".gridcard").forEach(function(card){
    card.onclick=function(){
      idx=Number(card.dataset.page)||0;isGrid=false;
      renderSpread();renderGrid();updatePager();
      document.getElementById("toggle").textContent="All Spreads 全部跨頁";
      document.getElementById("stage").classList.remove("hidden");
      document.getElementById("nav").classList.remove("hidden");
      document.getElementById("grid").classList.add("hidden");
    };
  });
}
function zoom(src,caption){
  var ov=document.createElement("div");ov.className="zoom";
  ov.innerHTML='<button class="close" aria-label="Close zoom 關閉放大">&times;</button><img src="'+escapeHTML(src)+'" alt="'+escapeHTML(caption)+'"><div class="cap">'+escapeHTML(caption)+'</div>';
  ov.onclick=function(){ov.remove();};ov.querySelector("img").onclick=function(e){e.stopPropagation();};
  document.body.appendChild(ov);ov.querySelector(".close").focus();
}
function onKey(e){
  if(e.key==="Escape"){var z=document.querySelector(".zoom");if(z){z.remove();return;}if(isGrid){toggleView();return;}}
  if(isGrid)return;
  if(e.key==="ArrowLeft")turn(-1);else if(e.key==="ArrowRight")turn(1);
  else if(e.key==="Home"){idx=0;renderSpread();renderGrid();updatePager();}
  else if(e.key==="End"){idx=pairTotal()-1;renderSpread();renderGrid();updatePager();}
}
function addSwipe(){
  var sx=0,sy=0,stage=document.getElementById("stage");
  stage.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY;});
  stage.addEventListener("pointerup",function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50)turn(dx<0?1:-1);});
}
init();
</script>
</body>
</html>
